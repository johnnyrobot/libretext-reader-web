<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Listen mode voices (LT-216)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="listen.css">
  <script type="module" src="listen.js"></script>
</head>
<body>
  <main>
    <h1>Listen mode voices</h1>
    <p class="note">Each voice runs here in your browser, as Listen mode would. The first
      Play in a language downloads its model (about 190 MB), once.</p>

    <label for="lang">Language</label>
    <select id="lang"></select>

    <label for="text">Text</label>
    <textarea id="text" rows="6"></textarea>

    <div class="row">
      <button id="play" type="button">Play</button>
      <button id="stop" type="button" disabled>Stop</button>
      <button id="save" type="button" disabled>Save WAV</button>
    </div>

    <p id="status" role="status">Pick a language and press Play.</p>
    <dl id="stats"></dl>
    <p id="credit" class="note"></p>
  </main>
</body>
</html>
